name: Publish site

# Puts the page and the puzzle files players may see (up to tomorrow, UTC) on GitHub Pages.
# Runs every day at 09:40 UTC: the earliest time zone (UTC+14) starts its next day at 10:00 UTC,
# so each day's puzzle goes online just before anyone can play it, and no earlier.
on:
  schedule:
    - cron: "40 9 * * *"
  push:
    branches: [main]
    paths: [site/**, puzzles/**, tools/publish.py, tools/config.json]
  workflow_run:
    workflows: ["Build puzzles"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/publish.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
