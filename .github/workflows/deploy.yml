name: Publish site

# Puts the page and every built puzzle file on GitHub Pages (--all), so ?debug can step through
# future days on the live site. To hold future puzzles back again, drop --all from the publish step:
# then only puzzles up to tomorrow (UTC) go online, and the daily 09:40 UTC run releases each one
# just before the earliest time zone (UTC+14) reaches that date.
on:
  schedule:
    - cron: "40 9 * * *"
  push:
    branches: [main]
    paths: [site/**, puzzles/**, tools/publish.py, tools/config.json]
  workflow_run:
    workflows: ["Build puzzles"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/publish.py --all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
